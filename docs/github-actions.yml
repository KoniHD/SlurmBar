name: Swift
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Package app
        run: ./scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SlurmBar
          path: dist/SlurmBar.app
